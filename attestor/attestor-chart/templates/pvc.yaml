{{- if eq (.Values.storage.type | default "emptyDir") "pvc" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: attestor-storage
spec:
  accessModes:
{{ toYaml .Values.storage.pvc.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.storage.pvc.size }}

  {{- /*
      Resolve storageClassName with priority:
      1. storage.storageClassName
      2. storage.pvc.storageClassName (optional backward compatibility)
      3. If none → omit field → Kubernetes uses default StorageClass
  */}}

  {{- $sc := .Values.storage.storageClassName | default .Values.storage.pvc.storageClassName }}
  {{- if $sc }}
  storageClassName: {{ $sc | quote }}
  {{- end }}

{{- end }}